  <style>
    :root {
      color-scheme: dark;
    }

    body {
      background-color: #020617;
      background-image:
        radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.14), transparent 28%),
        radial-gradient(circle at 85% 30%, rgba(168, 85, 247, 0.15), transparent 28%),
        radial-gradient(circle at 50% 85%, rgba(111, 219, 152, 0.08), transparent 35%);
      background-attachment: fixed;
      color: #e2e8f0;
      -webkit-font-smoothing: antialiased;
    }

    /* b.a.r.e. | FORM Text Gradient */
    .text-gradient {
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-image: linear-gradient(to right, #8B5CF6, #a855f7, #C4B5FD);
    }

    /* b.a.r.e. | FORM Architectural Grid Pattern for Card Banners */
    .bg-grid-pattern {
      background-image:
        linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
      background-size: 24px 24px;
    }

    /* Static Glass Card (Read-Only Course Containers — Zero False Hover Movement) */
    .glass-card-static {
      background: rgba(30, 41, 59, 0.58);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 12px 32px -10px rgba(0, 0, 0, 0.5);
    }

    /* Interactive Glass Card (Flip Cards & Clickable Triggers — Moves on Hover) */
    .glass-card-interactive {
      background: rgba(30, 41, 59, 0.62);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.11);
      transition: border-color 0.35s ease, box-shadow 0.35s ease;
    }
    .glass-card-interactive:hover {
      border-color: rgba(255, 255, 255, 0.28);
      box-shadow: 0 16px 36px -10px rgba(0, 0, 0, 0.65);
    }

    /* Strict Geometric Icon Badge Centering */
    .bare-badge-center {
      display: grid !important;
      place-items: center !important;
    }
    .bare-badge-center > i {
      display: block;
      line-height: 1;
      text-align: center;
      margin: 0 auto;
    }

    /* FontAwesome Watermark & 64px Badge Glyph Sizing */
    .fa-badge-icon {
      font-size: 1.75rem;
    }
    .fa-bg-icon {
      font-size: 10.5rem;
      line-height: 1;
    }

    /* True iOS Liquid Glass Header & Footer */
    .pnix-liquid-header {
      background: rgba(15, 23, 42, 0.72);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .pnix-liquid-footer {
      background: rgba(15, 23, 42, 0.82);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border-top: 1px solid rgba(255, 255, 255, 0.09);
    }

    /* Liquid Glass Slide-Out Drawer Shell & Menu Tiles */
    .pnix-liquid-drawer {
      background: linear-gradient(
        165deg,
        rgba(22, 32, 50, 0.75) 0%,
        rgba(15, 23, 42, 0.85) 60%,
        rgba(2, 6, 23, 0.92) 100%
      );
      backdrop-filter: blur(24px) saturate(190%);
      -webkit-backdrop-filter: blur(24px) saturate(190%);
      border-right: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 16px 0 48px 0 rgba(0, 0, 0, 0.75);
    }

    .pnix-glass-item {
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.07) 0%,
        rgba(30, 41, 59, 0.35) 100%
      );
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.12);
    }
    .pnix-glass-item:hover {
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.12) 0%,
        rgba(104, 0, 165, 0.28) 100%
      );
      border-color: rgba(111, 219, 152, 0.45);
      transform: translateX(3px);
    }

    .pnix-glass-item-active {
      background: linear-gradient(
        135deg,
        rgba(111, 219, 152, 0.16) 0%,
        rgba(104, 0, 165, 0.38) 100%
      );
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(111, 219, 152, 0.65);
      box-shadow:
        0 8px 24px -4px rgba(104, 0, 165, 0.45),
        inset 0 1px 0 0 rgba(255, 255, 255, 0.25);
    }

    /* Primary Kinetic Purple Action CTA */
    .pnix-kinetic-btn {
      background: linear-gradient(135deg, #7C3AED 0%, #9333EA 100%);
      color: #FFFFFF;
      font-weight: 500;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 4px 22px rgba(104, 0, 165, 0.55);
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .pnix-kinetic-btn:hover {
      background: linear-gradient(135deg, #7E22CE 0%, #A855F7 100%);
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(147, 51, 234, 0.68);
    }

    /* Top Spectrum Position Bar */
    .pnix-spectrum-bar {
      background: linear-gradient(90deg, #8B5CF6 0%, #a855f7 50%, #B9A1FF 100%);
      box-shadow: 0 0 14px rgba(168, 85, 247, 0.6);
      transition: width 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* =====================================================================
       DYNAMIC CONTENT-GROWING 3D IN-PLACE FLIP CARD ENGINE
       Uses CSS Grid 1x1 overlay so cards grow naturally with enlarged text
       while flipping strictly in-place without dropping rows.
       ===================================================================== */
    .flip-scene {
      position: relative;
      z-index: 10;
      perspective: 1200px;
      -webkit-perspective: 1200px;
    }
    .flip-card-inner {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      width: 100%;
      min-height: 100%;
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      transform-style: preserve-3d;
      -webkit-transform-style: preserve-3d;
    }
    .flip-card-inner.is-flipped {
      transform: rotateY(180deg);
      -webkit-transform: rotateY(180deg);
    }
    .flip-face {
      grid-area: 1 / 1 / 2 / 2;
      width: 100%;
      min-height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transform: rotateY(0deg) translateZ(1px);
      -webkit-transform: rotateY(0deg) translateZ(1px);
    }
    .flip-face-back {
      transform: rotateY(180deg) translateZ(2px);
      -webkit-transform: rotateY(180deg) translateZ(2px);
    }

    /* Modal Transitions */
    #diagram-modal {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    #diagram-modal.active {
      opacity: 1;
      pointer-events: auto;
    }
    #diagram-modal-content {
      transform: scale(0.95) translateY(16px);
      opacity: 0;
      transition: all 0.28s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #diagram-modal.active #diagram-modal-content {
      transform: scale(1) translateY(0);
      opacity: 1;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }

    /* Respect Reduced Motion Preferences */
    @media (prefers-reduced-motion: reduce) {
      *, ::before, ::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
      .flip-card-inner {
        transition: none !important;
      }
      .flip-card-inner:not(.is-flipped) .flip-face-back {
        display: none !important;
      }
      .flip-card-inner.is-flipped .flip-face-front {
        display: none !important;
      }
      .flip-card-inner.is-flipped,
      .flip-face-back {
        transform: none !important;
        -webkit-transform: none !important;
      }
    }
  </style>

  <!-- =====================================================================
       COURSE DATA & RENDER ENGINE (100% 2020 SCRUM GUIDE SYLLABUS)
       ===================================================================== -->
<script src="assets/lucide.js"></script><script>(()=>{

    /**
     * 2020 Scrum Guide Dataset & Scenarios
     */
    const scenariosData = [
      {
        id: "sc-1",
        accountability: "Developers",
        theme: "Sprint Backlog Ownership",
        title: "The Mid-Sprint Executive Directive",
        description: "Day 4 of a 10-day Sprint: The VP of Sales demands an urgent 'unplanned' authentication feature for a critical prospect. The Product Owner immediately agrees and commands two specific Developers to drop their ongoing Sprint backlog tasks and immediately start coding the VP's requests.",
        question: "According to the 2020 Scrum Guide, which response aligns strictly with Scrum principles?",
        difficulty: "Core Accountability",
        options: [
          {
            id: "opt-1",
            text: "The Developers must comply immediately because the Product Owner owns the scope and prioritizes all value delivery.",
            isCorrect: false,
            feedback: "The PO owns the Product Backlog, but does NOT manage the Developers or assign daily tasks.",
            principle: "The 2020 Scrum Guide states: 'The Sprint Backlog is a plan by and for the Developers.' No one can tell the Developers how to turn Product Backlog items into Increments of value.",
            antiPattern: "Command-and-Control PO / The Proxy Project Manager. Treating the Sprint Backlog as a top-down dispatch queue destroys self-management."
          },
          {
            id: "opt-2",
            text: "The Developers and PO collaboratively assess whether this request impacts the Sprint Goal. If it does not endanger the Goal, the Developers can negotiate adapting the Sprint Backlog.",
            isCorrect: true,
            feedback: "Spot on! The Sprint Goal is the commitment. Scope can be clarified and renegotiated with the Product Owner as more is learned, provided the Sprint Goal is not compromised.",
            principle: "2020 Scrum Guide: 'No changes are made that would endanger the Sprint Goal.' Scope may be clarified and renegotiated with the Product Owner as more is learned.",
            antiPattern: "Avoided 'Rigid Scope Lock' and avoided 'Arbitrary Scope Injection'."
          },
          {
            id: "opt-3",
            text: "The Scrum Master must intervene and immediately cancel the current Sprint because new requirements arrived.",
            isCorrect: false,
            feedback: "A Sprint is only cancelled if the Sprint Goal becomes obsolete, and ONLY the Product Owner has the authority to do so.",
            principle: "2020 Scrum Guide: 'A Sprint could be cancelled if the Sprint Goal becomes obsolete. Only the Product Owner has the authority to cancel the Sprint.'",
            antiPattern: "The Authoritarian Scrum Master. The SM does not cancel Sprints unilaterally over new feature requests."
          },
          {
            id: "opt-4",
            text: "The Developers should secretly work overtime to finish both the current Sprint items and the VP's request without telling anyone.",
            isCorrect: false,
            feedback: "Working hidden overtime destroys transparency and sustainable pace.",
            principle: "Scrum rests on transparency and sustainable work: 'Scrum makes clear the relative efficacy of current practices so that improvements can be made.'",
            antiPattern: "Dark Backlog / Hero Culture. Hiding real capacity leads to technical debt and burnout."
          }
        ]
      },
      {
        id: "sc-2",
        accountability: "Scrum Master",
        theme: "Servant Leadership vs Project Control",
        title: "The Burndown Police at the Daily Scrum",
        description: "During the Daily Scrum, the Scrum Master shares their screen displaying a 100% committed burndown chart. The SM calls on each Developer one by one, questioning why task burn hours are lagging behind the linear trend line and asking for adjusted individual commitments.",
        question: "How should the Daily Scrum be conducted under the 2020 Scrum Guide?",
        difficulty: "Daily Scrum Purpose",
        options: [
          {
            id: "opt-1",
            text: "The Daily Scrum is for Developers to inspect progress toward the Sprint Goal and adapt the Sprint Backlog. The SM is not required to run it.",
            isCorrect: true,
            feedback: "Exact. The Daily Scrum is an event for and by the Developers. The Scrum Master serves by ensuring it takes place and stays within the 15-minute timebox, not by leading a status interrogation.",
            principle: "2020 Scrum Guide: 'The Daily Scrum is a 15-minute event for the Developers of the Scrum Team... The Developers can select whatever structure and techniques they want, as long as their Daily Scrum focuses on progress toward the Sprint Goal.'",
            antiPattern: "Avoided 'Command-and-Control Status Meeting'. Daily Scrum is not a status report to management or the Scrum Master."
          },
          {
            id: "opt-2",
            text: "The Scrum Master is solely accountable for tracking story point burndown velocities daily and reallocating tickets.",
            isCorrect: false,
            feedback: "Scrum does not mandate burndowns or story points, and the SM does not reassign tasks.",
            principle: "The 2020 Scrum Guide removed references to tracking remaining work via burndowns; the focus is solely on progress toward the singular Sprint Goal.",
            antiPattern: "The Micromanager SM / Velocity Obsession. Replacing true value alignment with linear burndown enforcement."
          },
          {
            id: "opt-3",
            text: "The Product Owner should be running the meeting and asking the three traditional questions.",
            isCorrect: false,
            feedback: "The 2020 Scrum Guide removed the rigid 'three questions' format, and the PO does not direct the Daily Scrum.",
            principle: "The Daily Scrum is strictly by and for the Developers to inspect and adapt their own work.",
            antiPattern: "PO Status Interrogation."
          },
          {
            id: "opt-4",
            text: "The Scrum Master should cancel the Daily Scrum if the burndown chart is on schedule.",
            isCorrect: false,
            feedback: "The Daily Scrum is a mandatory inspect-and-adapt cadence, not an optional review triggered only when falling behind.",
            principle: "2020 Scrum Guide: Daily Scrum is a formal event held every working day of the Sprint to reduce complexity and improve communication.",
            antiPattern: "Skipping Inspection Cadences."
          }
        ]
      },
      {
        id: "sc-3",
        accountability: "Whole Scrum Team",
        theme: "Sprint Planning & Sprint Goal",
        title: "Sprint Planning Without a Goal",
        description: "At the conclusion of an 8-hour Sprint Planning session, the team has pulled 14 unrelated Jira issues matching their estimated velocity. When asked what the Sprint Goal is, the team responds: 'Our goal is simply to complete all 14 assigned tickets.'",
        question: "What Scrum Guide 2020 standard was violated in this planning session?",
        difficulty: "Planning Accountability",
        options: [
          {
            id: "opt-1",
            text: "Nothing was violated. Completing 100% of pulled backlog items is the primary definition of a Sprint Goal.",
            isCorrect: false,
            feedback: "A list of tickets is NOT a Sprint Goal. A Sprint Goal is a single objective that provides coherence and flexibility.",
            principle: "2020 Scrum Guide: 'The Sprint Goal is the single objective for the Sprint. Although the Sprint Goal is a commitment by the Developers, it provides flexibility in terms of the exact work needed to achieve it.'",
            antiPattern: "The Feature Factory / Ticket Punching. Viewing Sprints as mere delivery batches rather than outcomes that solve a tangible customer problem."
          },
          {
            id: "opt-2",
            text: "Sprint Planning Topic 1 ('Why is this Sprint valuable?') was neglected. The Scrum Team must craft a Sprint Goal that communicates why the Sprint is valuable.",
            isCorrect: true,
            feedback: "Precise! The 2020 Scrum Guide defines three explicit planning topics: Topic 1: Why is this Sprint valuable? Topic 2: What can be Done? Topic 3: How will the chosen work get done?",
            principle: "2020 Scrum Guide: 'The Product Owner proposes how the product could increase its value and utility in the current Sprint. The whole Scrum Team then collaborates to define a Sprint Goal that communicates why the Sprint is valuable.'",
            antiPattern: "Avoided 'Mechanical Scrum / Goal-less Sprinting'."
          },
          {
            id: "opt-3",
            text: "The Product Owner is supposed to write the Sprint Goal alone in advance without consulting the Developers.",
            isCorrect: false,
            feedback: "The PO proposes value, but the WHOLE Scrum Team collaborates to define the Sprint Goal.",
            principle: "2020 Scrum Guide explicitly states: 'The whole Scrum Team then collaborates to define a Sprint Goal.'",
            antiPattern: "Ivory Tower Product Owner."
          },
          {
            id: "opt-4",
            text: "The Developers should never commit to more than 5 tickets at once regardless of velocity.",
            isCorrect: false,
            feedback: "Scrum does not mandate ticket count limits; it relies on self-management and empirical sizing.",
            principle: "Developers select items from the Product Backlog based on their past performance, upcoming capacity, and Definition of Done.",
            antiPattern: "Arbitrary Process Constraints."
          }
        ]
      },
      {
        id: "sc-4",
        accountability: "Developers",
        theme: "Increment & Definition of Done",
        title: "The Pre-Release 'Hardening Sprint'",
        description: "After four Sprints of rapid feature development, the engineering manager announces Sprint 5 will be a 'Hardening and Integration Sprint' dedicated exclusively to manual regression testing, bug remediation, and pipeline fixing before releasing to production.",
        question: "Why is a 'Hardening Sprint' an anti-pattern under the 2020 Scrum Guide?",
        difficulty: "Definition of Done",
        options: [
          {
            id: "opt-1",
            text: "Every Sprint must produce a usable, thoroughly tested Increment that meets the Definition of Done. Hardening Sprints defer quality and obscure technical debt.",
            isCorrect: true,
            feedback: "Masterful understanding! In Scrum, an Increment must be usable and meet the Definition of Done *at the moment it is created* every single Sprint.",
            principle: "2020 Scrum Guide: 'An Increment is a concrete stepping stone toward the Product Goal. Each Increment is additive to all prior Increments and thoroughly verified, ensuring that all Increments work together. In order to provide value, the Increment must be usable.'",
            antiPattern: "Avoided 'Waterfall in a Sprint Costume / Mini-Waterfall'. Pushing testing to a future sprint violates empiricism."
          },
          {
            id: "opt-2",
            text: "Hardening Sprints are fully endorsed, but they must be limited to exactly 1 calendar week.",
            isCorrect: false,
            feedback: "The Scrum Guide recognizes no such concept as hardening, stabilization, or testing sprints.",
            principle: "There is no special sprint type in Scrum. Every Sprint follows the exact same cadence and commitments.",
            antiPattern: "The 'Sprint 0' / 'Hardening Sprint' myth."
          },
          {
            id: "opt-3",
            text: "The Scrum Master is supposed to perform all integration testing during the Sprint Review, not Developers.",
            isCorrect: false,
            feedback: "The SM is not a QA tester, and the Sprint Review is an inspection of progress with stakeholders, not a testing phase.",
            principle: "Developers are accountable for instilling quality by adhering to a Definition of Done.",
            antiPattern: "Role Misconception."
          },
          {
            id: "opt-4",
            text: "Testing is optional in Scrum as long as the Product Owner accepts the User Stories in Jira.",
            isCorrect: false,
            feedback: "If an item does not meet the Definition of Done, it cannot be released or even presented at the Sprint Review.",
            principle: "2020 Scrum Guide: 'If a Product Backlog item does not meet the Definition of Done, it cannot be released or even presented at the Sprint Review.'",
            antiPattern: "Done isn't Done / Debt Accumulation."
          }
        ]
      },
      {
        id: "sc-5",
        accountability: "Product Owner",
        theme: "Product Backlog Adaptation & Review",
        title: "The Fixed Product Backlog at Sprint Review",
        description: "During the Sprint Review, primary stakeholders and beta customers highlight that a competitor just launched an identical feature, rendering the next 3 scheduled roadmap features low-value. The Product Owner refuses to adjust the Product Backlog, citing: 'The annual plan was approved by the board, so the backlog is locked.'",
        question: "How does this behavior conflict with the Product Owner accountability in Scrum?",
        difficulty: "Product Goal & Empiricism",
        options: [
          {
            id: "opt-1",
            text: "The PO is correct because the Product Backlog should only be updated once per fiscal quarter.",
            isCorrect: false,
            feedback: "The Product Backlog is never locked; it is an emergent, ordered list that continuously adapts.",
            principle: "2020 Scrum Guide: 'The Product Backlog is an emergent, ordered list of what is needed to improve the product. It is the single source of work undertaken by the Scrum Team.'",
            antiPattern: "The Plan-Driven Dogmatist. Mistaking Scrum for iterative stage-gate delivery."
          },
          {
            id: "opt-2",
            text: "The Sprint Review is an inspect-and-adapt event where the Scrum Team and stakeholders collaborate on what to do next based on new discoveries.",
            isCorrect: true,
            feedback: "Precisely! The Sprint Review is not merely a demo show-and-tell; it is a collaborative working session where the Product Backlog is adjusted to reflect reality.",
            principle: "2020 Scrum Guide: 'The purpose of the Sprint Review is to inspect the outcome of the Sprint and determine future adaptations. The Scrum Team presents the results of their work to key stakeholders and progress toward the Product Goal is discussed... the Product Backlog may also be adjusted to meet new opportunities.'",
            antiPattern: "Avoided 'Demo-Only Sprint Review' and 'Fixed-Scope Roadmapping'."
          },
          {
            id: "opt-3",
            text: "The Developers should vote out the Product Owner immediately without informing management.",
            isCorrect: false,
            feedback: "Accountability changes are organizational, not handled through impromptu team coups.",
            principle: "The Scrum Guide defines accountabilities, but interpersonal and organizational structures are resolved through leadership and coaching.",
            antiPattern: "Governance Breakdown."
          },
          {
            id: "opt-4",
            text: "Stakeholders are forbidden from providing critical feedback during a Sprint Review.",
            isCorrect: false,
            feedback: "Stakeholder collaboration is the fundamental heartbeat of the Sprint Review.",
            principle: "2020 Scrum Guide: Attendees collaborate on what was done and what has changed in their environment. Based on this, attendees collaborate on what to do next.",
            antiPattern: "Shielded Ivory Tower."
          }
        ]
      }
    ];

    /**
     * Application State
     */
    let state = {
      currentIndex: 0,
      activeFilter: 'ALL',
      filteredScenarios: [...scenariosData],
      selectedOptionId: null,
      answered: false,
      score: 0,
      userAnswers: {}, // scenarioId -> { optionId, isCorrect, antiPattern }
    };

    const STORAGE_KEY = "pnix_mastery_scenarios_v2";

    /**
     * Initialization & LocalStorage Restore
     */
    function engine_init() {
      engine_loadStoredState();
      engine_renderScenario();
      engine_updateHeaderStats();
      lucide.createIcons();
    }

    function engine_loadStoredState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          state.activeFilter = ['ALL','Product Owner','Scrum Master','Developers'].includes(parsed.activeFilter) ? parsed.activeFilter : 'ALL';
          state.filteredScenarios = scenariosData.filter(s => state.activeFilter === 'ALL' || s.accountability === state.activeFilter);
          state.userAnswers = parsed.userAnswers || {};
          state.score = parsed.score || 0;
          state.currentIndex = Math.min(parsed.currentIndex || 0, state.filteredScenarios.length - 1);
        }
      } catch (e) {
        console.warn("Storage load fallback", e);
      }
    }

    function engine_saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          userAnswers: state.userAnswers,
          score: state.score,
          activeFilter: state.activeFilter, currentIndex: state.currentIndex
        }));
      } catch (e) {
        console.warn("Storage write failure", e);
      }
    }

    /**
     * Filtering Logic
     */
    function engine_setFilter(role) {
      state.activeFilter = role;
      document.querySelectorAll('.filter-tab').forEach(btn => {
        if (btn.dataset.filter === role) {
          btn.className = "filter-tab px-3 py-1.5 rounded-lg text-xs font-medium bg-purple-600/30 text-purple-200 border border-purple-500/40 transition-all";
        } else {
          btn.className = "filter-tab px-3 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-white transition-all";
        }
      });

      if (role === 'ALL') {
        state.filteredScenarios = [...scenariosData];
      } else {
        state.filteredScenarios = scenariosData.filter(s => s.accountability === role);
      }

      state.currentIndex = 0;
      state.answered = false;
      state.selectedOptionId = null;
      engine_saveState();
      engine_renderScenario();
      engine_updateHeaderStats();
    }

    /**
     * Render Active Scenario
     */
    function engine_renderScenario() {
      const container = document.getElementById('quiz-container');
      const resultsScreen = document.getElementById('results-screen');
      const feedbackDrawer = document.getElementById('feedback-drawer');

      // If finished all in current filter
      if (state.currentIndex >= state.filteredScenarios.length) {
        engine_showResults();
        return;
      }

      container.classList.remove('hidden');
      resultsScreen.classList.add('hidden');
      feedbackDrawer.classList.add('hidden');

      const scenario = state.filteredScenarios[state.currentIndex];
      
      // Update Scaffolding Text
      document.getElementById('idx-counter').innerText = state.currentIndex + 1;
      document.getElementById('total-counter').innerText = state.filteredScenarios.length;
      document.getElementById('scenario-accountability-pill').innerText = `Role: ${scenario.accountability}`;
      document.getElementById('scenario-theme-pill').innerText = `#${scenario.theme.replace(/\s+/g, '')}`;
      document.getElementById('scenario-title').innerText = scenario.title;
      document.getElementById('scenario-description').innerText = scenario.description;
      document.getElementById('scenario-question').innerText = scenario.question;
      document.getElementById('scenario-difficulty').innerText = scenario.difficulty;

      // Update progress bar
      const pct = ((state.currentIndex + 1) / state.filteredScenarios.length) * 100;
      document.getElementById('progress-bar').style.width = `${pct}%`;

      // Render Options
      const optionsContainer = document.getElementById('options-container');
      optionsContainer.innerHTML = '';

      // Check if previously answered
      const previousAnswer = state.userAnswers[scenario.id];

      scenario.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.id = `opt-card-${opt.id}`;
        btn.onclick = () => engine_selectOption(opt.id);
        btn.className = "w-full text-left p-4 sm:p-5 rounded-xl glass-card-interactive flex items-start gap-4 text-slate-200 group";

        const letter = String.fromCharCode(65 + idx);

        btn.innerHTML = `
          <div id="badge-${opt.id}" class="w-8 h-8 rounded-lg bg-white/5 border border-white/10 flex items-center justify-center font-mono text-xs font-semibold text-slate-300 group-hover:border-purple-400/50 group-hover:text-purple-300 shrink-0 transition-colors">
            ${letter}
          </div>
          <div class="flex-1 text-sm sm:text-base leading-snug">
            ${opt.text}
          </div>
        `;

        optionsContainer.appendChild(btn);
      });

      // If user had answered this before in session, show feedback immediately
      if (previousAnswer) {
        engine_selectOption(previousAnswer.selectedId, false);
      } else {
        state.answered = false;
        state.selectedOptionId = null;
      }

      engine_updateHeaderStats();
      lucide.createIcons();
    }

    /**
     * Option Selection & Evaluation
     */
    function engine_selectOption(optionId, isNewInput = true) {
      if (state.answered && isNewInput) return; // prevent re-answering on same turn

      const scenario = state.filteredScenarios[state.currentIndex];
      const selected = scenario.options.find(o => o.id === optionId);
      if (!selected) return;

      state.answered = true;
      state.selectedOptionId = optionId;

      // Score tallying
      if (isNewInput && !state.userAnswers[scenario.id]) {
        if (selected.isCorrect) {
          state.score += 100;
        }
        state.userAnswers[scenario.id] = {
          scenarioTitle: scenario.title,
          accountability: scenario.accountability,
          selectedId: optionId,
          isCorrect: selected.isCorrect,
          antiPattern: selected.antiPattern,
          principle: selected.principle,
          reasoning: selected.feedback
        };
        engine_saveState();
      }

      // Visual Updates on cards
      scenario.options.forEach(opt => {
        const card = document.getElementById(`opt-card-${opt.id}`);
        const badge = document.getElementById(`badge-${opt.id}`);
        
        if (!card) return;
        card.disabled = true;

        if (opt.id === selected.id) {
          if (opt.isCorrect) {
            // Selected & Correct: Emerald Glow
            card.className = "w-full text-left p-4 sm:p-5 rounded-xl border bg-emerald-950/40 border-emerald-500/80 text-white flex items-start gap-4 shadow-lg shadow-emerald-950/40";
            badge.className = "w-8 h-8 rounded-lg bg-emerald-500 text-black font-bold flex items-center justify-center shrink-0";
            badge.innerHTML = `<i data-lucide="check" class="w-4 h-4"></i>`;
          } else {
            // Selected & Incorrect: Rose Red
            card.className = "w-full text-left p-4 sm:p-5 rounded-xl border bg-rose-950/40 border-rose-500/80 text-white flex items-start gap-4 shadow-lg shadow-rose-950/40";
            badge.className = "w-8 h-8 rounded-lg bg-rose-500 text-white font-bold flex items-center justify-center shrink-0";
            badge.innerHTML = `<i data-lucide="x" class="w-4 h-4"></i>`;
          }
        } else if (opt.isCorrect) {
          // Highlight the true answer if user picked wrong
          card.className = "w-full text-left p-4 sm:p-5 rounded-xl border border-emerald-500/50 bg-emerald-950/15 text-emerald-200 flex items-start gap-4";
          badge.className = "w-8 h-8 rounded-lg bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 flex items-center justify-center shrink-0";
          badge.innerHTML = `<i data-lucide="check" class="w-4 h-4"></i>`;
        } else {
          // Dim other options
          card.className = "w-full text-left p-4 sm:p-5 rounded-xl border border-white/5 bg-black/20 text-slate-500 flex items-start gap-4 opacity-80";
        }
      });

      // Populate Feedback Drawer
      const drawer = document.getElementById('feedback-drawer');
      const iconBox = document.getElementById('feedback-icon-box');
      const icon = document.getElementById('feedback-icon');
      const verdict = document.getElementById('feedback-verdict');
      const pointsTag = document.getElementById('feedback-points-tag');
      const reasoning = document.getElementById('feedback-reasoning');
      const principle = document.getElementById('feedback-principle');
      const antipattern = document.getElementById('feedback-antipattern');

      if (selected.isCorrect) {
        iconBox.className = "w-10 h-10 rounded-xl bg-emerald-500/20 border border-emerald-500/40 text-emerald-400 flex items-center justify-center shrink-0";
        icon.setAttribute('data-lucide', 'check-circle');
        verdict.innerText = "Accurate Scrum 2020 Standard";
        verdict.className = "text-lg font-bold text-emerald-300 tracking-tight";
        pointsTag.className = "px-3 py-1 rounded-full text-xs font-mono font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30";
        pointsTag.innerText = "+100 Pts Earned";
      } else {
        iconBox.className = "w-10 h-10 rounded-xl bg-rose-500/20 border border-rose-500/40 text-rose-400 flex items-center justify-center shrink-0";
        icon.setAttribute('data-lucide', 'alert-octagon');
        verdict.innerText = "Anti-Pattern Deviation Detected";
        verdict.className = "text-lg font-bold text-rose-300 tracking-tight";
        pointsTag.className = "px-3 py-1 rounded-full text-xs font-mono font-bold bg-rose-500/20 text-rose-300 border border-rose-500/30";
        pointsTag.innerText = "0 Pts Added";
      }

      reasoning.innerText = selected.feedback;
      principle.innerText = selected.principle;
      antipattern.innerText = selected.antiPattern;

      drawer.classList.remove('hidden');
      engine_updateHeaderStats();
      lucide.createIcons();

      // Smooth scroll down to feedback
      drawer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    /**
     * Proceed to Next Scenario
     */
    function engine_nextScenario() {
      state.currentIndex++;
      engine_saveState();
      state.answered = false;
      state.selectedOptionId = null;
      engine_saveState();
      engine_renderScenario();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    /**
     * Header & Score Sync
     */
    function engine_updateHeaderStats() {
      document.getElementById('current-score').innerText = state.score;
    }

    /**
     * Show Final Diagnostic Summary
     */
    function engine_showResults() {
      const container = document.getElementById('quiz-container');
      const resultsScreen = document.getElementById('results-screen');
      container.classList.add('hidden');
      resultsScreen.classList.remove('hidden');

      requestAnimationFrame(() => {
        modal.classList.add('active');
        const closeBtn = document.getElementById('modal-close-btn');
        if (closeBtn) closeBtn.focus();
      });

      document.body.style.overflow = 'hidden';
    }

    function closeDiagramModal() {
      const modal = document.getElementById('diagram-modal');
      if (!modal || modal.classList.contains('hidden')) return;

      modal.classList.remove('active');
      modal.setAttribute('aria-hidden', 'true');
      modal.setAttribute('inert', '');
      document.body.style.overflow = '';

      const finishClose = () => {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
        if (lastModalTrigger && typeof lastModalTrigger.focus === 'function') {
          lastModalTrigger.focus();
        }
      };

      if (prefersReducedMotion()) {
        finishClose();
      } else {
        setTimeout(finishClose, 220);
      }
    }

    const drawer = document.getElementById('nav-drawer');
    const backdrop = document.getElementById('drawer-backdrop');
    const drawerOpenBtn = document.getElementById('drawer-open-btn');

    function openDrawer() {
      lastDrawerTrigger = document.activeElement;

      backdrop.classList.remove('hidden');
      drawer.classList.remove('hidden');
      drawer.classList.add('flex');
      drawer.removeAttribute('aria-hidden');
      drawer.removeAttribute('inert');
      drawerOpenBtn.setAttribute('aria-expanded', 'true');

      requestAnimationFrame(() => {
        backdrop.classList.remove('opacity-0');
        drawer.classList.remove('-translate-x-full');
        const closeBtn = document.getElementById('drawer-close-btn');
        if (closeBtn) closeBtn.focus();
      });
    }

    function closeDrawer(restoreFocus = true) {
      if (drawer.classList.contains('hidden')) return;

      backdrop.classList.add('opacity-0');
      drawer.classList.add('-translate-x-full');
      drawer.setAttribute('aria-hidden', 'true');
      drawer.setAttribute('inert', '');
      drawerOpenBtn.setAttribute('aria-expanded', 'false');

      const finishClose = () => {
        backdrop.classList.add('hidden');
        drawer.classList.add('hidden');
        drawer.classList.remove('flex');
        if (restoreFocus && lastDrawerTrigger && typeof lastDrawerTrigger.focus === 'function') {
          lastDrawerTrigger.focus();
        }
      };

      if (prefersReducedMotion()) {
        finishClose();
      } else {
        setTimeout(finishClose, 220);
      }
    }

    document.addEventListener('keydown', (e) => {
      const modal = document.getElementById('diagram-modal');
      const isModalOpen = modal && !modal.classList.contains('hidden');
      const isDrawerOpen = drawer && !drawer.classList.contains('hidden');

      if (e.key === 'Escape') {
        if (isModalOpen) {
          e.preventDefault();
          closeDiagramModal();
        } else if (isDrawerOpen) {
          e.preventDefault();
          closeDrawer(true);
        }
        return;
      }

      if (isModalOpen) {
        trapFocus(e, modal);
      } else if (isDrawerOpen) {
        trapFocus(e, drawer);
      }
    });

    /* =====================================================================
       BURNDOWN TELEMETRY ENGINE
       ===================================================================== */
    function updateBurndownChart(mode) {
      const validMode = ['healthy', 'scope', 'late'].includes(mode) ? mode : 'healthy';
      appState.burndownMode = validMode;
      saveState();

      const selectEl = document.getElementById('burndown-scenario');
      if (selectEl && selectEl.value !== validMode) {
        selectEl.value = validMode;
      }

      const container = document.getElementById('burndown-svg-container');
      const caption = document.getElementById('burndown-caption');
      if (!container || !caption) return;

      const datasets = {
        healthy: {
          label: "Healthy empirical flow burndown chart showing steady completion from 100% on Day 1 to 0% on Day 10.",
          points: [100, 88, 79, 68, 55, 48, 36, 25, 14, 5, 0],
          color: "#B9A1FF",
          text: "<strong>Healthy Empirical Flow:</strong> Work is completed steadily as small Product Backlog items meet the Definition of Done throughout the Sprint."
        },
        scope: {
          label: "Mid-Sprint scope discovery burndown chart showing remaining work rising on Day 4 before trending down to 0% on Day 10.",
          points: [100, 90, 82, 75, 96, 84, 66, 48, 30, 15, 0],
          color: "#A855F7",
          text: "<strong>Mid-Sprint Scope Discovery:</strong> On Day 4, newly discovered technical complexity increased remaining work before the Developers adapted their plan."
        },
        late: {
          label: "Delayed testing bottleneck burndown chart showing remaining work staying nearly flat until Day 8 before dropping sharply.",
          points: [100, 98, 96, 95, 92, 90, 88, 85, 80, 45, 0],
          color: "#EA580C",
          text: "<strong>Delayed Testing Bottleneck:</strong> Work stays flat until the final two days because testing was deferred to the end instead of finishing increments continuously."
        }
      };

      const active = datasets[validMode];
      const coords = active.points.map((val, idx) => {
        const x = 48 + (idx * 29);
        const y = 155 - ((val / 100) * 130);
        return `${x},${y}`;
      }).join(' ');

      container.innerHTML = `
        <svg viewBox="0 0 360 190" role="img" aria-label="${active.label}" class="w-full h-auto overflow-visible">
          <line x1="48" y1="25" x2="338" y2="25" stroke="#475569" stroke-opacity="0.3" stroke-dasharray="3 3"/>
          <line x1="48" y1="90" x2="338" y2="90" stroke="#475569" stroke-opacity="0.3" stroke-dasharray="3 3"/>
          <line x1="48" y1="155" x2="338" y2="155" stroke="#94a3b8" stroke-opacity="0.4"/>
          <text x="42" y="29" text-anchor="end" fill="#cbd5e1" font-size="11" font-family="JetBrains Mono">100%</text>
          <text x="42" y="94" text-anchor="end" fill="#cbd5e1" font-size="11" font-family="JetBrains Mono">50%</text>
          <text x="42" y="158" text-anchor="end" fill="#cbd5e1" font-size="11" font-family="JetBrains Mono">0%</text>

          <line x1="48" y1="25" x2="338" y2="155" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 5"/>
          <polyline fill="none" stroke="${active.color}" stroke-width="3" points="${coords}" />
          ${active.points.map((val, idx) => {
            const x = 48 + (idx * 29);
            const y = 155 - ((val / 100) * 130);
            return `<circle cx="${x}" cy="${y}" r="3.5" fill="#020617" stroke="${active.color}" stroke-width="2"/>`;
          }).join('')}
          <text x="48" y="176" fill="#e2e8f0" font-size="11" font-family="JetBrains Mono">Day 1</text>
          <text x="193" y="176" text-anchor="middle" fill="#e2e8f0" font-size="11" font-family="JetBrains Mono">Day 5</text>
          <text x="338" y="176" text-anchor="end" fill="#e2e8f0" font-size="11" font-family="JetBrains Mono">Day 10</text>
        </svg>
      `;
      caption.innerHTML = active.text;
    }

    /* =====================================================================
       SCENARIO LAB QUIZ ENGINE (Text + Color Feedback & State Persistence)
       ===================================================================== */
    function getQuizStats() {
      const answeredIndices = Object.keys(appState.quizAnswers)
        .map(k => Number(k))
        .filter(k => !Number.isNaN(k) && k >= 0 && k < EXAM_QUESTIONS.length);
      let correctCount = 0;
      answeredIndices.forEach(qIdx => {
        if (appState.quizAnswers[qIdx] === EXAM_QUESTIONS[qIdx].correct) {
          correctCount += 1;
        }
      });
      return {
        answeredCount: answeredIndices.length,
        correctCount,
        total: EXAM_QUESTIONS.length
      };
    }

    function applyScenarioState(qIdx, selectedIdx) {
      const q = EXAM_QUESTIONS[qIdx];
      const feedback = document.getElementById(`q-feedback-${qIdx}`);
      const statusPill = document.getElementById(`q-status-pill-${qIdx}`);
      if (!q || !feedback) return;

      const isRight = selectedIdx === q.correct;
      const selectedLetter = String.fromCharCode(65 + selectedIdx);
      const correctLetter = String.fromCharCode(65 + q.correct);

      if (statusPill) {
        statusPill.className = isRight
          ? "px-3 py-1 rounded-full bg-emerald-400/15 border border-emerald-400/40 font-mono text-xs text-emerald-300"
          : "px-3 py-1 rounded-full bg-rose-500/15 border border-rose-400/40 font-mono text-xs text-rose-300";
        statusPill.textContent = isRight ? "Answered • Correct" : "Answered • Review Needed";
      }

      q.options.forEach((_, idx) => {
        const btn = document.getElementById(`q-${qIdx}-opt-${idx}`);
        const badge = document.getElementById(`q-${qIdx}-badge-${idx}`);
        if (!btn || !badge) return;

        const isSelected = idx === selectedIdx;
        btn.setAttribute('aria-pressed', isSelected ? 'true' : 'false');

        btn.className = "w-full text-left p-4 rounded-xl border text-base transition-all flex items-start justify-between gap-3.5 focus:outline-none focus-visible:ring-2 focus-visible:ring-pnix-mint ";

        if (idx === q.correct && isSelected) {
          btn.className += "border-emerald-400 bg-emerald-400/15 text-white font-normal";
          badge.className = "shrink-0 px-2.5 py-1 rounded-lg font-mono text-xs font-medium bg-emerald-400/20 border border-emerald-400/40 text-emerald-200";
          badge.textContent = "✓ Selected • Correct";
        } else if (idx === q.correct && !isSelected) {
          btn.className += "border-emerald-400/80 bg-emerald-400/10 text-white font-normal";
          badge.className = "shrink-0 px-2.5 py-1 rounded-lg font-mono text-xs font-medium bg-emerald-400/15 border border-emerald-400/35 text-emerald-200";
          badge.textContent = "✓ Correct Answer";
        } else if (isSelected && idx !== q.correct) {
          btn.className += "border-rose-500 bg-rose-500/15 text-slate-100 font-normal";
          badge.className = "shrink-0 px-2.5 py-1 rounded-lg font-mono text-xs font-medium bg-rose-500/20 border border-rose-400/40 text-rose-200";
          badge.textContent = "✕ Your Choice • Incorrect";
        } else {
          btn.className += "border-white/10 bg-slate-900/40 text-slate-400 font-light";
          badge.className = "hidden";
          badge.textContent = "";
        }
      });

      feedback.classList.remove('hidden');
      feedback.innerHTML = `
        <div class="font-mono text-xs sm:text-sm font-semibold ${isRight ? 'text-emerald-300' : 'text-rose-300'}">
          ${isRight
            ? `✓ Correct (Option ${selectedLetter}) — 2020 Scrum Guide Standard`
            : `✕ Not Quite (You selected Option ${selectedLetter}; Correct Answer is Option ${correctLetter})`
          }
        </div>
        <div class="text-sm sm:text-base text-slate-200 leading-relaxed">${q.breakdown}</div>
      `;
    }

    function evaluateScenario(qIdx, selectedIdx) {
      appState.quizAnswers[qIdx] = selectedIdx;
      saveState();
      applyScenarioState(qIdx, selectedIdx);
      updateProgressSummaries();
    }

    function resetQuizProgress() {
      appState.quizAnswers = {};
      saveState();
      if (SYLLABUS_MODULES[activeModuleIndex].id === 6) {
        renderModule(activeModuleIndex, false);
      } else {
        updateProgressSummaries();
      }
    }

    function updateProgressSummaries() {
      const mod = SYLLABUS_MODULES[activeModuleIndex];
      const stats = getQuizStats();

      // Header & Footer Visible Position Labels
      const headerStatus = document.getElementById('header-mod-status');
      const footerStatus = document.getElementById('footer-mod-status');
      const drawerPos = document.getElementById('drawer-position-status');
      const drawerVisited = document.getElementById('drawer-visited-status');
      const drawerQuiz = document.getElementById('drawer-quiz-status');
      const quizLabSummary = document.getElementById('quiz-lab-summary');

      if (headerStatus) headerStatus.textContent = mod.code;
      if (footerStatus) footerStatus.textContent = `${activeModuleIndex + 1} of ${SYLLABUS_MODULES.length}`;
      if (drawerPos) drawerPos.textContent = mod.code;
      if (drawerVisited) drawerVisited.textContent = `${appState.visitedModules.length} of ${SYLLABUS_MODULES.length} viewed`;
      if (drawerQuiz) {
        drawerQuiz.textContent = stats.answeredCount > 0
          ? `${stats.answeredCount} of ${stats.total} answered (${stats.correctCount} correct)`
          : `0 of ${stats.total} answered`;
      }
      if (quizLabSummary) {
        quizLabSummary.textContent = stats.answeredCount > 0
          ? `${stats.answeredCount} of ${stats.total} answered • ${stats.correctCount} correct`
          : `0 of ${stats.total} scenarios answered`;
      }

      // Render Drawer Navigation List with Honest Position/Visited/Quiz Badges
      const drawerList = document.getElementById('drawer-nav-list');
      if (drawerList) {
        drawerList.innerHTML = SYLLABUS_MODULES.map((m, i) => {
          const isCurrent = i === activeModuleIndex;
          const isVisited = appState.visitedModules.includes(i);
          let statusBadge = '';

          if (m.id === 6 && stats.answeredCount === stats.total) {
            statusBadge = `<span class="px-2 py-0.5 rounded-full bg-emerald-400/15 border border-emerald-400/40 font-mono text-[11px] text-emerald-300 shrink-0">${stats.correctCount}/${stats.total} Quiz</span>`;
          } else if (isCurrent) {
            statusBadge = `<span class="px-2 py-0.5 rounded-full bg-pnix-mint/20 border border-pnix-mint/50 font-mono text-[11px] text-pnix-mint shrink-0">Current</span>`;
          } else if (isVisited) {
            statusBadge = `<span class="px-2 py-0.5 rounded-full bg-slate-800 border border-white/10 font-mono text-[11px] text-slate-300 shrink-0">Viewed</span>`;
          }

          return `
            <button
              type="button"
              onclick="renderModule(${i}); closeDrawer(false);"
              ${isCurrent ? 'aria-current="step"' : ''}
              class="w-full text-left p-3.5 rounded-xl transition-all duration-200 flex items-center justify-between gap-2 focus:outline-none focus-visible:ring-2 focus-visible:ring-pnix-mint ${
                isCurrent
                  ? 'pnix-glass-item-active text-white'
                  : 'pnix-glass-item text-slate-200 hover:text-white'
              }"
            >
              <div class="min-w-0">
                <div class="font-mono text-xs text-pnix-mint tracking-wide">${m.code}</div>
                <div class="font-display font-normal text-sm sm:text-base mt-0.5 truncate">${m.title}</div>
              </div>
              ${statusBadge}
            </button>
          `;
        }).join('');
      }
    }

    function renderModule(index, shouldScroll = true) {
      activeModuleIndex = Math.max(0, Math.min(SYLLABUS_MODULES.length - 1, index));
      appState.activeModuleIndex = activeModuleIndex;
      if (!appState.visitedModules.includes(activeModuleIndex)) {
        appState.visitedModules.push(activeModuleIndex);
      }
      saveState();

      const mod = SYLLABUS_MODULES[activeModuleIndex];

      // Update Top Spectrum Position Bar
      const pct = ((activeModuleIndex + 1) / SYLLABUS_MODULES.length) * 100;
      document.getElementById('top-progress-bar').style.width = `${pct}%`;

      // Render Viewport
      const viewport = document.getElementById('module-viewport');
      viewport.innerHTML = mod.Render();
      if(mod.id === 7) mountScenarioEngine();

      // Restore Module-Specific Interactive States
      if (mod.id === 4) {
        updateBurndownChart(appState.burndownMode);
      }

      if (mod.id === 6) {
        Object.keys(appState.quizAnswers).forEach(qKey => {
          const qIdx = Number(qKey);
          const selIdx = appState.quizAnswers[qKey];
          if (!Number.isNaN(qIdx) && typeof selIdx === 'number') {
            applyScenarioState(qIdx, selIdx);
          }
        });
      }

      // Update Footer Controls (Keep navigation separate from clearing quiz answers)
      const prevBtn = document.getElementById('prev-mod-btn');
      const nextLabel = document.getElementById('next-btn-label');
      prevBtn.disabled = activeModuleIndex === 0;
      nextLabel.textContent = 'Next';

      // Render Footer Dots
      const dots = document.getElementById('footer-dots');
      dots.innerHTML = SYLLABUS_MODULES.map((m, i) => `
        <button
          type="button"
          onclick="renderModule(${i})"
          aria-label="Go to ${m.code}: ${m.title}"
          ${i === activeModuleIndex ? 'aria-current="step"' : ''}
          class="h-2.5 rounded-full transition-all focus:outline-none focus-visible:ring-2 focus-visible:ring-pnix-mint ${
            i === activeModuleIndex ? 'w-8 bg-purple-400' : 'w-2.5 bg-slate-600 hover:bg-slate-400'
          }"
        ></button>
      `).join('');

      updateProgressSummaries();

      if (shouldScroll) {
        window.scrollTo({
          top: 0,
          behavior: prefersReducedMotion() ? 'auto' : 'smooth'
        });
      }
    }

    // Event Listeners
    document.getElementById('drawer-open-btn').addEventListener('click', openDrawer);
    document.getElementById('drawer-close-btn').addEventListener('click', () => closeDrawer(true));
    backdrop.addEventListener('click', () => closeDrawer(true));

    document.getElementById('prev-mod-btn').addEventListener('click', () => {
      if (activeModuleIndex > 0) renderModule(activeModuleIndex - 1);
    });

    document.getElementById('next-mod-btn').addEventListener('click', () => {
      if (activeModuleIndex < SYLLABUS_MODULES.length - 1) {
        renderModule(activeModuleIndex + 1);
      } else {
        renderModule(0);
      }
    });

    // Boot Application
    renderModule(activeModuleIndex, false);
  </script>
<script>if("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("./sw.js").catch(console.warn);</script><script>
(()=>{

try{const saved=localStorage.getItem('pnix_ambient_motion');if(saved!==null)enabled=saved==='on'&&!preference.matches;}catch(e){}
function update(){
 const playing=enabled&&!document.hidden&&!preference.matches;
 button.textContent='Background motion: '+(enabled&&!preference.matches?'On':'Off');
 button.setAttribute('aria-pressed',String(enabled&&!preference.matches));
 if(!playing)layer.classList.add('still');
 if(playing)video.play().catch(()=>{layer.classList.add('still');button.textContent='Background motion: Off';button.setAttribute('aria-pressed','false');});else video.pause();
}
button.addEventListener('click',()=>{enabled=!(enabled&&!preference.matches);try{localStorage.setItem('pnix_ambient_motion',enabled?'on':'off');}catch(e){}update();});
preference.addEventListener('change',update);
document.addEventListener('visibilitychange',update);
video.addEventListener('playing',()=>layer.classList.remove('still'));
['pause','waiting','ended','error'].forEach(event=>video.addEventListener(event,()=>layer.classList.add('still')));

})();
